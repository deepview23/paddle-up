<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paddle Up Auction</title>
<meta name="description" content="Cricket auction night for family and friends.">
<meta name="theme-color" content="#0A0F1D">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Paddle Up">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  /* Auction-floor broadcast look: deep stage navy, hammer gold, franchise colours carry identity */
  --stage:#0A0F1D; --panel:#121A2D; --panel2:#18223A; --line:#26314D;
  --ink:#EEF1F7; --muted:#8D97AF; --gold:#E9B949; --gold2:#FFD978;
  --good:#3DDC97; --bad:#FF5A6E; --warn:#FFB547;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 50% -10%,#1B2A55 0%,transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:10px 14px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:12px 16px 90px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 12px}
.brand{font-family:var(--display);letter-spacing:.5px;font-size:22px;line-height:1}
.brand small{display:block;font:600 11px var(--cond);letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--cond);letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.live{color:#fff;background:#B3122E}.pill.ok{color:var(--good)}.pill.gold{color:var(--stage);background:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:600 13px var(--cond);letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero{padding:22px 4px 8px}
.hero h1{font-family:var(--display);font-size:clamp(38px,9vw,72px);line-height:.95;letter-spacing:.5px}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);max-width:56ch;margin:10px 0 0}
.big{width:100%;padding:16px;font-size:17px;border-radius:14px}
.primary{background:var(--gold);color:#1a1300}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{background:#3a1520;color:var(--bad)}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.choice{display:flex;flex-direction:column;gap:8px}
.choice h3{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:.3px}
.gamerow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
/* franchises */
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ftile{position:relative;text-align:left;padding:12px;border-radius:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel2);border:2px solid transparent}
.ftile .ab{font-family:var(--display);font-size:26px;line-height:1}
.ftile .who{font-size:13px;font-weight:600}
.ftile.mine{border-color:var(--gold)}
.ftile.free{opacity:.9;background:repeating-linear-gradient(135deg,var(--panel2) 0 10px,#1b2640 10px 20px)}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--cond);letter-spacing:.8px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.settings{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.settings label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
/* auction */
.stagegrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.stagegrid{grid-template-columns:1.35fr 1fr}}
.setbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 13px var(--cond);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.lotcard{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--panel2),var(--panel) 60%)}
.lotcard .stripe{position:absolute;inset:0 auto 0 0;width:6px}
.pname{font-family:var(--display);font-size:clamp(34px,8vw,54px);line-height:1;letter-spacing:.3px;margin:6px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px var(--cond);letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--stage);border:1px solid var(--line)}
.tag.os{color:#7FD3FF;border-color:#1f4d66}
.bidline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.lbl{font:600 12px var(--cond);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.amount{font-family:var(--display);font-size:clamp(40px,11vw,68px);line-height:.95;color:var(--gold2);font-variant-numeric:tabular-nums}
.leader{margin-top:6px}
.clock{position:relative;width:86px;height:86px;flex:none}
.clock svg{transform:rotate(-90deg)}
.clock .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.call{min-height:26px;margin-top:10px;font:700 18px var(--cond);letter-spacing:2px;text-transform:uppercase;color:var(--warn)}
.stamp{position:absolute;right:14px;top:16px;transform:rotate(-8deg);font-family:var(--display);font-size:46px;padding:2px 14px;border:4px solid;border-radius:10px;letter-spacing:2px;animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
.stamp.sold{color:var(--good)}.stamp.uns{color:var(--bad)}
@keyframes slam{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.bidbtn{width:100%;padding:18px;border-radius:16px;font-family:var(--display);font-size:26px;letter-spacing:.6px;font-weight:400}
.reason{text-align:center;font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.rtmbox{border:1px dashed var(--gold);border-radius:14px;padding:12px;display:grid;gap:8px}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{font:600 11px var(--cond);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.board th:first-child,.board td:first-child{text-align:left}
.board td{white-space:nowrap;padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font-weight:600}
.board tr.lead td{background:rgba(233,185,73,.08)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,15,29,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:5}
.tabs button{flex:1;max-width:180px;background:transparent;color:var(--muted);font:600 13px var(--cond);letter-spacing:1.5px;text-transform:uppercase}
.tabs button.on{color:var(--gold);background:var(--panel2)}
.plist{display:grid;gap:6px}
.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.pl .nm{font-weight:600}
.pl .pr{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pl.pick{cursor:pointer;border:1px solid transparent}
.pl.pick.on{border-color:var(--gold);background:#2a2716}
.pl.dis{opacity:.4;cursor:not-allowed}
.log{display:grid;gap:6px;max-height:420px;overflow:auto}
.hostbar{display:flex;gap:6px;flex-wrap:wrap}
.hostbar button{padding:7px 10px;font-size:13px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:9;font-weight:600;max-width:90vw}
.hidden{display:none!important}
details summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details li{margin:4px 0}
.teamhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:8px}
.teamhead .ab{font-family:var(--display);font-size:24px}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

.top .row{gap:6px;justify-content:flex-end}
.top .row button{padding:7px 10px;font-size:13px}
@media (max-width:480px){.brand{font-size:18px}.brand small{font-size:9px;letter-spacing:1.4px}}

.brandwrap{display:flex;align-items:center;gap:10px}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;background:transparent;color:var(--muted);font:600 13px var(--cond);letter-spacing:1.4px;text-transform:uppercase}
.seg button.on{background:var(--panel2);color:var(--gold)}
.scard{background:var(--panel2);border-radius:12px;padding:12px;display:grid;gap:6px}
.score{font-family:var(--display);font-size:30px;color:var(--gold2)}
.sbar{display:grid;grid-template-columns:62px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sbar div{height:6px;background:var(--stage);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.sbar b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.champ{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 35%,var(--panel)),var(--panel) 70%);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}

.lothead{display:flex;align-items:center;gap:14px;margin:8px 0 10px}
.lothead .pname{margin:0}
.prow{display:flex;align-items:center;gap:10px}
.av{position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1) 55%,color-mix(in srgb,var(--c1) 70%,#000));
  box-shadow:0 0 0 2px var(--c2),0 4px 14px rgba(0,0,0,.35);color:var(--ink)}
.av b{font-family:var(--display);font-weight:400;font-size:calc(var(--s)*.38);letter-spacing:.5px;line-height:1}
.av i{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font:700 calc(var(--s)*.15 + 4px)/1 var(--cond);font-style:normal;letter-spacing:.6px;background:var(--stage);color:var(--gold);padding:2px 5px;border-radius:5px;border:1px solid var(--line)}
.av em{position:absolute;top:-3px;right:-5px;font-style:normal;font-size:calc(var(--s)*.22 + 4px);line-height:1}

.stats{margin-top:12px;overflow-x:auto}
.stats table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.stats th,.stats td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.stats thead th{font:600 10px var(--cond);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.stats tbody th{text-align:left;font:700 12px var(--cond);letter-spacing:1px;color:var(--gold)}
.stats td.muted{text-align:left;white-space:normal}

.rt{display:flex;gap:10px;font:600 11px var(--cond);letter-spacing:.8px;color:var(--muted);white-space:nowrap}
.rt b{color:var(--ink);font-size:13px}

/* live player card */
.pcard{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 38%,var(--panel2)) 0%,var(--panel) 55%,var(--panel) 100%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--lead) 40%,transparent),0 18px 40px rgba(0,0,0,.35)}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--lead))}
.pc-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;font:700 12px var(--cond);letter-spacing:1.6px;text-transform:uppercase}
.pc-set{color:var(--gold);background:rgba(0,0,0,.25);padding:4px 10px;border-radius:999px}
.pc-lot{color:var(--muted)}
.pc-hero{position:relative;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px 10px}
.pc-wm{position:absolute;right:-6px;top:-14px;font-family:var(--display);font-size:120px;line-height:1;color:#fff;opacity:.06;pointer-events:none;letter-spacing:2px}
.pc-hero .av{box-shadow:0 0 0 3px var(--c2),0 0 0 6px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45)}
.pc-name{font-family:var(--display);font-size:clamp(30px,8vw,48px);line-height:1;letter-spacing:.3px;text-wrap:balance}
.pc-meta{margin-top:6px;font-weight:600;color:#dfe5f2}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip2{font:700 11px var(--cond);letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
.chip2.os{color:#8fdcff}.chip2.rtm{color:var(--stage);background:var(--gold);border-color:var(--gold)}
.pc-style{margin-top:6px;font-size:13px;color:var(--muted)}
.pc-base{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 12px}
.pc-base span{font:600 11px var(--cond);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.pc-base b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.pcard .stats{margin:4px 16px 0}
.pcard .stats table{background:rgba(0,0,0,.22);border-radius:12px;overflow:hidden}
.pcard .stats tbody tr:nth-child(odd){background:rgba(255,255,255,.03)}
.stats-note{font-size:11px;color:var(--muted);margin-top:4px}
.pc-bid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px 0}
.pcard .call{padding:0 16px 14px}
.pcard .stamp{top:6px;right:16px;z-index:2}

.hints{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.hint{font:700 12px var(--cond);letter-spacing:.8px;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:var(--stage);border:1px solid var(--line);color:var(--muted)}
.hint.ok{color:var(--good);border-color:#1d5a42}.hint.bad{color:var(--bad);border-color:#5a1d2a}

.sheet-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sheet-t th{font:600 11px var(--cond);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.sheet-t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.sheet-t td:first-child{color:var(--muted);width:28px;font-weight:700}
.sheet-t tr.xi td:first-child{color:var(--gold)}
.sheet-t .num{text-align:right;white-space:nowrap;font-weight:700}
.sheet-t .spec{font-size:13px;color:#cfd6e6}
.sheet-t .mv{white-space:nowrap;text-align:right}
.sheet-t .mv button{padding:4px 8px;margin-left:4px;font-size:12px}
.sheet-t tr.empty td{color:#4a5576}
.sheet-t tr.divider td{font:700 11px var(--cond);letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(233,185,73,.07);padding:6px}

.pcard .stats table{font-size:12px}
.pcard .stats th,.pcard .stats td{padding:6px 3px}
.pcard .stats tbody th{padding-left:8px}
.pcard .stats td:last-child,.pcard .stats th:last-child{padding-right:8px}
.sheet-t td{padding:7px 4px}
.sheet-t .mv{width:34px;padding-right:0}
.sheet-t .mv div{display:flex;flex-direction:column;gap:3px}
.sheet-t .mv button{margin:0;padding:2px 8px;line-height:1.2}
.sheet-t .spec{font-size:12px}

.pcard .stats table{font-size:11.5px}
.pcard .stats th,.pcard .stats td{padding:6px 2px}
.pcard .stats thead th{font-size:9.5px;letter-spacing:.8px}

/* ---------- paddle moments ---------- */
#paddle{position:fixed;inset:0;pointer-events:none;z-index:60;display:grid;place-items:center}
#paddle .pd{opacity:0;display:grid;justify-items:center;gap:2px;padding:22px 44px 18px;border-radius:22px;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--ink);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.14) inset;min-width:220px}
#paddle .pd-team{font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:4px;opacity:.85}
#paddle .pd-amt{font-family:Anton,Impact,sans-serif;font-size:56px;line-height:1;letter-spacing:1px}
#paddle .pd-name{font-family:"Barlow Condensed",sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:2px;opacity:.85}
#paddle.go .pd{animation:paddle 1.05s cubic-bezier(.2,.9,.25,1) both}
@keyframes paddle{0%{opacity:0;transform:translateY(26px) scale(.86) rotate(-3deg)}
  16%{opacity:1;transform:translateY(0) scale(1.04) rotate(0)}26%{transform:scale(1)}
  72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-14px) scale(.97)}}
body.tvmode #paddle .pd-amt{font-size:110px}
body.tvmode #paddle .pd{padding:34px 80px 28px}
@media (prefers-reduced-motion:reduce){#paddle.go .pd{animation:paddlefade 1s linear both}
  @keyframes paddlefade{0%,100%{opacity:0}15%,70%{opacity:1}}}

/* ---------- bid ticker ---------- */
.ticker{display:flex;align-items:center;gap:6px;padding:8px 14px 2px;overflow:hidden;white-space:nowrap;font-family:"Barlow Condensed",sans-serif}
.tk{display:inline-flex;gap:5px;align-items:baseline;font-size:13px;color:var(--muted);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.04)}
.tk b{font-weight:700;letter-spacing:.5px}
.tk.now{background:var(--c1);color:var(--ink);font-size:14px}
.tk-arr{color:var(--line);font-size:12px}

/* ---------- commentary ---------- */
.card.slim{padding:10px 14px}
.comm{display:grid;gap:6px}
.comm .cm{font-size:13px;color:var(--muted);line-height:1.35}
.comm .cm.now{color:var(--ink);font-size:15px;font-weight:500}
.comm.big .cm{font-size:16px}.comm.big .cm.now{font-size:22px;line-height:1.3}
.comm .cm:nth-child(n+3){opacity:.55}

/* ---------- target chip ---------- */
.chip2.tgt{background:rgba(233,185,73,.16);color:var(--gold2);border:1px solid rgba(233,185,73,.4)}
.chip2.tgt.over{background:rgba(220,70,70,.16);color:#ff8d8d;border-color:rgba(220,70,70,.45)}

/* ---------- planner ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.tile span{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.tile b{font-family:Anton,Impact,sans-serif;font-size:22px;font-weight:400}
.tile.good b{color:var(--good)}.tile.bad b{color:var(--bad)}
.trow{display:grid;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.trow.dead{opacity:.6}.trow.live{box-shadow:0 0 0 2px var(--gold) inset}
.tctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tctl select,.tctl input[type=number]{padding:6px 8px}
.st{font-size:12px;font-weight:600;justify-self:start;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}

  padding:6px 12px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--wa),#111 50%,var(--wb));box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.18);animation:warin .35s ease-out}
@keyframes warin{from{opacity:0;transform:translate(-50%,-8px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.pcard.pc-hot{animation:hotpulse 1.1s ease-in-out infinite}
@keyframes hotpulse{0%,100%{box-shadow:0 0 0 0 rgba(233,185,73,0),0 10px 30px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 3px rgba(233,185,73,.55),0 0 28px rgba(233,185,73,.35)}}
.pcard.pc-war .amount{color:var(--gold2,#F5D27A)}
@media (prefers-reduced-motion:reduce){.pcard.pc-hot,.warban{animation:none}}
.scarce{margin-top:5px;font-size:12px;line-height:1.3;color:var(--muted);background:rgba(255,255,255,.05);border-radius:8px;padding:3px 8px;display:inline-block}
.scarce b{color:#fff}.scarce.low{background:rgba(233,185,73,.14);color:#f3dca0}
/* word reactions */
.reacts.words{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.reacts.words::-webkit-scrollbar{display:none}
.reactrow .reacts.words button{font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;padding:7px 10px;white-space:nowrap;border-radius:999px}
.reactrow{min-width:0}.reactrow .reacts{min-width:0;flex:1}
.rtog{font-size:17px;padding:5px 8px;background:var(--panel);flex:none}
.rfloat.word span{font:700 20px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;background:linear-gradient(135deg,#E9B949,#d38f1c);color:#1a1205;padding:6px 12px;border-radius:14px 14px 14px 4px;box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap}
/* radar */
.radar{margin:4px auto 10px;display:grid;justify-items:center;gap:4px;max-width:320px}
.radar svg{max-width:100%;height:auto;overflow:visible}
.radar text{font:600 11px "Barlow Condensed",sans-serif;fill:var(--muted);letter-spacing:.03em}.radar text.v{font-size:10px;fill:#fff;opacity:.8}
.radar figcaption{text-align:center}
/* how to play */
.howbtn{background:transparent;border:1px solid var(--line);color:var(--gold);font-size:13px;padding:6px 12px;border-radius:999px}
.howto{position:fixed;inset:0;z-index:90;background:rgba(3,6,16,.78);backdrop-filter:blur(4px);display:grid;place-items:center;padding:14px;overflow:auto}
.howcard{background:var(--panel2,#121a33);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:18px;display:grid;gap:10px;max-height:92vh;overflow:auto}
.hstep{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.hstep p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.hn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1205;font:20px Anton,Impact,sans-serif}
.hrules{display:grid;gap:2px;font-size:13px;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}.hrules span{color:var(--muted)}
/* presets */
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.preset{display:grid;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.preset b{font:600 16px "Barlow Condensed",sans-serif;letter-spacing:.03em}.preset span{font-size:12px;color:var(--muted);line-height:1.3}
.preset.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(233,185,73,.08)}
.pc-top{position:relative}.pc-top .warban{top:8px}
.scarce{font-size:11.5px;margin-top:4px;padding:2px 8px}

.pc-top .spd{font-style:normal;color:#9cc0ff}
.pc-top{min-height:30px}
.pc-chips{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;min-width:0}.pc-chips::-webkit-scrollbar{display:none}
.pc-chips .chip2{flex:none;white-space:nowrap}

.pc-style{min-height:1.3em}

.pc-bid>div:first-child{min-width:0}
.ticker{height:34px;box-sizing:border-box}

.pc-info{height:30px;padding:0 12px;display:flex;align-items:center;overflow:hidden}
.pc-info .realp,.pc-info .scarce{margin:0;padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;box-sizing:border-box}
.call{height:26px;min-height:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.actrow{min-height:76px;align-content:start}

.actrow .passbtn{height:52px!important;min-height:0!important}

.side.gq .lbl{flex:none;width:110px}

.pc-top .warban{left:12px;right:12px;top:50%;transform:translateY(-50%);text-align:center;overflow:hidden;text-overflow:ellipsis;animation:none;padding:7px 12px;

// Auction engine. Money is in lakhs (100 L = 1 Cr). Pure state machine run by the host.
const ENG = (() => {
  const RET_SLABS = [1800, 1400, 1100, 1800, 1400]; // IPL 2025 mega-auction capped retention slabs
  const RET_UNCAPPED = 400;
  const BASE = { 1: 200, 2: 200, 3: 150, 4: 75, 5: 50, 6: 30 };
  const MIN_BASE = 30;
  const ROLE_NAME = { B: "Batter", W: "Wicketkeeper", A: "All-rounder", L: "Bowler" };

  function inc(a) { return a < 100 ? 5 : a < 200 ? 10 : a < 500 ? 20 : 25; }

  function addTeam(S, fid, owner, nick) {

  function removeTeam(S, fid) { if (S.phase === "lobby" && S.teams[fid]) { delete S.teams[fid]; S.v++; } }

  // previous franchise of a player: real 2026 squads, or the league's squads from last cycle
  function prevF(S, id, P) { return S.prev ? (S.prev[id] || null) : (P[id] ? P[id].f : null); }
  // ---------- retention ----------
  function validRetention(S, fid, list, P) {
    const ids = [...new Set(list)].filter(id => P[id] && prevF(S, id, P) === fid);
    const out = []; let capped = 0, unc = 0;

  }

  // ---------- sets ----------
  function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildOrder(S, P, rnd) {
    const taken = new Set();
    for (const t of Object.values(S.teams)) for (const pl of t.players) taken.add(pl.id);
    const maxTier = S.settings.pool === "stars" ? 4 : S.settings.pool === "quick" ? 5 : 6;
    const pool = P.filter(p => !taken.has(p.id) && p.t <= maxTier && (S.settings.pool !== "uncapped" || !p.c));
    const sets = [];
    const marquee = shuffle(pool.filter(p => p.t === 1), rnd);
    const half = Math.ceil(marquee.length / 2);
    if (marquee.length) sets.push(["Marquee Set 1", marquee.slice(0, half)]);
    if (marquee.length > half) sets.push(["Marquee Set 2", marquee.slice(half)]);
    const roles = ["B", "A", "W", "L"];
    for (const tiers of [[2], [3, 4]]) {

      for (const r of roles) {
        const g = pool.filter(p => !p.c && tiers.includes(p.t) && p.r === r);
        if (g.length) sets.push([`Uncapped ${SET_ROLE[r]} ${n}`, shuffle(g, rnd)]);

    }
    S.order = []; S.setNames = [];
    for (const [name, g] of sets) for (const p of g) { S.order.push(p.id); S.setNames.push(name); }
  }

  function startAuction(S, P, now, rnd = Math.random) {
    for (const [fid, t] of Object.entries(S.teams)) {

  // ---------- eligibility ----------

  function canAfford(S, t, amount, pid, P) {

  // ---------- timers: fast mode halves every clock; fast-forward when all people pass ----------
  function T(S, k) { const f = (S.fast ? 0.5 : 1) * (S.lot && S.lot.ff ? 0.3 : 1); return Math.max(1.5, S.settings[k] * f); }

  // ---------- lots ----------

    else postAuction(S);

  }

  }
  function toXI(S) { S.phase = "xi_pick"; S.lot = null; for (const t of Object.values(S.teams)) { t.xi = t.xi || []; t.xiLocked = false; } }

  function startAccel(S, P, now, noms) {

  }

  function sell(S, P, now, fid, price, how) {
    const t = S.teams[fid], L = S.lot;

    t.purse -= price;
    if (how === "RTM") t.rtm--;
    L.stage = "sold"; L.soldTo = fid; L.price = price; L.how = how; L.resultUntil = now + 3500;
    S.log.push({ k: "sold", pid: L.pid, fid, price, how, t: now });
    S.v++;
  }
  function unsold(S, now) {
    const L = S.lot; L.stage = "unsold"; L.resultUntil = now + 2200;
    S.unsold.push(L.pid); S.log.push({ k: "unsold", pid: L.pid, t: now }); S.v++;
  }

  // ---------- actions ----------
  // act: {type, lot(seq), amount}; returns error string or ""
  function apply(S, P, fid, act, now) {

    if (!t) return "Not a team";
    if (S.phase !== "auction" || !L) return "No live lot";

  }

  function hostCmd(S, P, cmd, now) {
    const L = S.lot;
    if (cmd === "pause" && !S.paused && L) { S.paused = true; S.pauseLeft = Math.max(0, L.ends - now); S.v++; }

  }

  // when every person has passed: let the AI teams finish their bidding instantly, then a short hammer
  function resolveBots(S, P, now, rnd = Math.random) {

    for (const [fid] of bots) if (S._bot[fid] == null) S._bot[fid] = botValue(S, fid, L.pid, P, rnd);
    for (let i = 0; i < 400 && L.stage === "bidding"; i++) {

      const cands = bots.filter(([fid, t]) => fid !== L.by && amt <= S._bot[fid] && !canAfford(S, t, amt, L.pid, P));
      if (!cands.length) break;

  }

  // ---------- AI franchises ----------
  const VAL = { 1: [1000, 2000], 2: [450, 1150], 3: [180, 520], 4: [80, 260], 5: [50, 320], 6: [30, 90] };
  function botValue(S, fid, pid, P, rnd) {
    const p = P[pid], t = S.teams[fid];
    const [lo, hi] = VAL[p.t];
    let v = (lo + (hi - lo) * rnd()) * Math.max(0.55, Math.min(1.7, Math.pow(overall(p) / 72, 2)));
    const roleCount = t.players.filter(x => P[x.id].r === p.r || (p.r === "W" && P[x.id].r === "W")).length;
    const target = { B: 6, W: 2, A: 6, L: 8 }[p.r];

  else { msg = `Not on your list. Safe ceiling: ${fmt(ceil)}.`; cls = "muted"; }
  const pos = v => Math.min(100, v / (lim * 1.15) * 100);
  return `<div class="card livecheck ${cls}"><div class="lbl">Live check · ${esc(p.n)}${t ? ` · ${PRI[t.pri].name}` : ""}</div>
    <div class="lcbar"><span class="lcfill" style="width:${pos(next)}%"></span>${max != null ? `<span class="lcmark max ${pos(max) > 65 ? "r" : pos(max) < 25 ? "l" : ""}" style="left:${Math.min(98, pos(max))}%"><em>Your max ${fmt(max)}</em></span>` : ""}<span class="lcmark ceil ${pos(ceil) > 65 ? "r" : pos(ceil) < 25 ? "l" : ""}" style="left:${Math.min(98, pos(ceil))}%"><em>Safe ceiling ${fmt(ceil)}</em></span></div>
    <div class="lcnow">Current ${fmt(cur || E.base(p))} · next bid <b>${fmt(next)}</b></div>
    <div class="lcmsg">${msg}</div></div>`;
}

function recordGame(S) {
  if (!S || S.phase !== "done") return;
  const id = (S.code || "P") + ":" + S.created; const list = seasonLoad(); if (list.some(r => r.id === id)) return;
  const J = E.judge(S, P); const fids = Object.keys(S.teams); const rank = fids.slice().sort((a, b) => J[b].total - J[a].total);
  const sold = (S.log || []).filter(x => x.k === "sold");
  const nameOf = f => { const t = S.teams[f]; return t.owner === A.uid ? (A.nick || "You") : t.owner === "bot" ? "AI" : (t.nick || "Player"); };
  const top = sold.slice().sort((a, b) => b.price - a.price)[0];
  list.push({ id, date: Date.now(), code: S.code, practice: A.mode === "practice", mine: myTeam(),
    teams: rank.map((f, i) => ({ f, owner: nameOf(f), bot: S.teams[f].owner === "bot", rank: i + 1, score: J[f].total,
      m: [J[f].batS, J[f].bowlS, J[f].phaseS, J[f].benchS, J[f].fieldS, J[f].spS, J[f].valueS, J[f].balS].map(Math.round),
      spent: J[f].spent, left: S.teams[f].purse, xi: J[f].xi, players: S.teams[f].players.map(x => [x.id, x.price, x.how]) })),
    sold: sold.length, total: sold.reduce((a, x) => a + x.price, 0), top: top ? [top.pid, top.fid, top.price] : null,
    trades: (S.log || []).filter(x => x.k === "trade").length });
  seasonSave(list);
}
function seasonView() {

  const by = {};

    const k = t.owner.toLowerCase(); const r = by[k] = by[k] || { name: t.owner, played: 0, wins: 0, pod: 0, sum: 0, best: 0, spent: 0, fr: {} };
    r.played++; if (t.rank === 1) r.wins++; if (t.rank <= 3) r.pod++; r.sum += t.score; r.best = Math.max(r.best, t.score); r.spent += t.spent; r.fr[t.f] = (r.fr[t.f] || 0) + 1;
  }
  const table = Object.values(by).sort((a, b) => b.wins - a.wins || b.sum / b.played - a.sum / a.played);
  const dt = ts => new Date(ts).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  const fav = r => Object.entries(r.fr).sort((a, b) => b[1] - a[1])[0][0];
  const allTeams = games.flatMap(g => g.teams.filter(t => incAI || !t.bot).map(t => ({ ...t, g })));
  const hi = allTeams.slice().sort((a, b) => b.score - a.score)[0];
  const buys = games.filter(g => g.top).map(g => ({ pid: g.top[0], f: g.top[1], price: g.top[2], g }));
  const bigBuy = buys.sort((a, b) => b.price - a.price)[0];

const SEASONS = ["Spring", "Summer", "Autumn", "Winter"];
const LG_PTS = [10, 7, 5, 3, 2, 1];
const LG_SQL = `create table if not exists public.leagues (
  id text primary key,
  data jsonb not null,
  rev integer not null default 1,
  updated_at timestamptz not null default now()
);
alter table public.leagues enable row level security;
create policy "leagues_read" on public.leagues for select to anon using (true);
create policy "leagues_insert" on public.leagues for insert to anon with check (true);
create policy "leagues_update" on public.leagues for update to anon using (true) with check (true);
grant select, insert, update on public.leagues to anon;`;
function seasonLabel(cycle, si) { return `Cycle ${cycle} · ${SEASONS[si]}`; }
function lgKindOf(si) { return si === 0 ? "mega" : "mini"; }
function lgLocal(id) { try { return JSON.parse(localStorage.getItem("pu.league." + id) || "null"); } catch (e) { return null; } }
function lgCache(lg) { try { localStorage.setItem("pu.league." + lg.id, JSON.stringify(lg)); const ids = myLeagueIds(); if (!ids.includes(lg.id)) localStorage.setItem("pu.leagues", JSON.stringify(ids.concat(lg.id))); } catch (e) {} }
function myLeagueIds() { try { const v = JSON.parse(localStorage.getItem("pu.leagues") || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
async function lgLoad(id) {
  const loc = lgLocal(id);
  const r = await NET.db.get(id);
  A.dbErr = r.err && r.err !== "offline" ? r.err : "";
  let lg = r.data;
  if (lg && loc && (loc.rev || 0) > (lg.rev || 0)) { lg = loc; NET.db.save(loc); }
  lg = lg || loc;
  if (lg) lgCache(lg);
  return lg;
}
async function lgSave(lg) {
  lgCache(lg);
  const err = await NET.db.save(lg);
  A.dbErr = err && err !== "offline" ? err : "";
  if (A.dbErr) toast("Saved on this device. Shared storage isn't set up yet.");
  return !A.dbErr;
}
function lgCode() { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
async function createLeague() {

}
async function openLeague(id) {

  if (id.length !== 6) return toast("League codes have 6 characters.");

}
// build a season's game from the league
function leagueGame(lg, code, owners) {
  const kind = lgKindOf(lg.si);
  const S = E.newGame(A.uid, code, lg.settings ? JSON.parse(JSON.stringify(lg.settings)) : undefined);
  S.league = { id: lg.id, name: lg.name, cycle: lg.cycle, si: lg.si, kind, label: seasonLabel(lg.cycle, lg.si) };
  if (lg.teams) {
    if (kind === "mega") { S.prev = {}; for (const [f, t] of Object.entries(lg.teams)) for (const x of t.players) S.prev[x.id] = f; }
    else { S.settings.retain = false; S.topup = lg.topup || 0; }
    for (const [f, t] of Object.entries(lg.teams)) {
      const own = owners && owners[f];
      S.teams[f] = { owner: own ? own.owner : "bot", nick: own ? own.nick : (t.nick || ""), purse: kind === "mini" ? t.purse + (lg.topup || 0) : S.settings.purse,
        players: kind === "mini" ? JSON.parse(JSON.stringify(t.players)) : [], rtm: 0, retain: [], ready: false, wasNick: t.nick || "" };
    }
  }
  return S;
}

// after a league season is judged: write it into the league
async function leagueCommit(S) {
  const gid = S.code + ":" + S.created;
  const base = (await lgLoad(S.league.id)) || A.league; if (!base) return;
  if (base.seasons.some(r => r.gameId === gid)) { A.league = base; return; }
  const J = E.judge(S, P), fids = Object.keys(S.teams), rank = fids.slice().sort((a, b) => J[b].total - J[a].total);
  const sold = (S.log || []).filter(x => x.k === "sold");
  const top = sold.slice().sort((a, b) => b.price - a.price)[0];
  const nameOf = f => { const t = S.teams[f]; return t.owner === "bot" ? (t.wasNick ? t.wasNick + " (AI)" : "AI") : (t.owner === A.uid ? (A.nick || "Host") : (t.nick || "Player")); };
  base.seasons.push({ gameId: gid, cycle: S.league.cycle, si: S.league.si, kind: S.league.kind, date: Date.now(), code: S.code,
    teams: rank.map((f, i) => ({ f, owner: nameOf(f), bot: S.teams[f].owner === "bot", rank: i + 1, pts: LG_PTS[i] || 0, score: J[f].total,
      m: [J[f].batS, J[f].bowlS, J[f].phaseS, J[f].benchS, J[f].fieldS, J[f].spS, J[f].valueS, J[f].balS].map(Math.round),
      spent: J[f].spent, left: S.teams[f].purse, xi: J[f].xi, n: S.teams[f].players.length })),
    sold: sold.length, total: sold.reduce((a, x) => a + x.price, 0), top: top ? [top.pid, top.fid, top.price] : null,
    trades: (S.trades || []).filter(t => t.status === "done").map(t => ({ from: t.from, to: t.to, give: t.give, get: t.get, cash: t.cash })),
    released: (S.released || []).length });
  base.teams = {};
  for (const [f, t] of Object.entries(S.teams)) base.teams[f] = { nick: t.owner === "bot" ? (t.wasNick || "") : (t.owner === A.uid ? A.nick : t.nick), purse: t.purse, players: t.players.map(x => ({ id: x.id, price: x.price, how: x.how })) };
  const { _bot, ...st } = S.settings; base.settings = { ...st, retain: true };
  base.si++; if (base.si >= 4) { base.si = 0; base.cycle++; }
  base.rev = (base.rev || 0) + 1;
  await lgSave(base);
  A.league = base; toast(`Saved to ${base.name}. Next: ${seasonLabel(base.cycle, base.si)}.`); render();
}

function lgStandings(lg, cycle) {
  const rows = {};
  for (const r of lg.seasons) {
    if (cycle && r.cycle !== cycle) continue;
    for (const t of r.teams) {
      const x = rows[t.f] = rows[t.f] || { f: t.f, owner: t.owner, pts: 0, played: 0, titles: 0, pod: 0, sum: 0, best: 0, spent: 0, trades: 0 };
      x.owner = t.owner; x.pts += t.pts; x.played++; if (t.rank === 1) x.titles++; if (t.rank <= 3) x.pod++; x.sum += t.score; x.best = Math.max(x.best, t.score); x.spent += t.spent;
    }
    for (const tr of r.trades || []) { if (rows[tr.from]) rows[tr.from].trades++; if (rows[tr.to]) rows[tr.to].trades++; }
  }
  return Object.values(rows).sort((a, b) => b.pts - a.pts || b.titles - a.titles || b.sum / b.played - a.sum / a.played);
}

async function sha(txt) { const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join(""); }

// ---------- original team stings (Web Audio, written for this app) ----------
const STING = (() => {
  const scales = [[0, 2, 4, 7, 9], [0, 3, 5, 7, 10], [0, 2, 4, 5, 7, 9, 11], [0, 2, 3, 5, 7, 8, 10], [0, 4, 7, 11], [0, 2, 5, 7, 9]];
  const waves = ["sawtooth", "square", "triangle"];
  const out = {};
  FIDS.forEach((f, k) => {
    let seed = 0; for (const ch of f) seed = (seed * 31 + ch.charCodeAt(0)) % 9973; seed += k * 101;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    const sc = scales[k % scales.length], root = 48 + Math.floor(rnd() * 10), bpm = 112 + Math.floor(rnd() * 44);
    const notes = []; let t = 0;
    for (let i = 0; i < 7; i++) { const d = [0.5, 0.5, 0.25, 0.75, 1][Math.floor(rnd() * 5)]; notes.push([root + 12 + sc[Math.floor(rnd() * sc.length)] + (rnd() > .75 ? 12 : 0), t, d]); t += d; }
    notes.push([root + 24, t, 1.5]);
    out[f] = { root, bpm, wave: waves[k % 3], notes, chord: [root, root + sc[2 % sc.length] + (sc.length > 4 ? 0 : 0), root + 7] };
  });
  return out;
})();
function playSting(f) {
  const s = STING[f], ac = audioCtx(); if (!s || !ac) return;
  const beat = 60 / s.bpm, t0 = ac.currentTime + 0.05, master = ac.createGain(); master.gain.value = 0.16; master.connect(ac.destination);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const tone = (m, at, dur, type, vol) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05); };
  s.chord.forEach(m => tone(m, t0, beat * 2, "triangle", 0.5));
  s.notes.forEach(([m, at, d]) => tone(m, t0 + at * beat, d * beat * 0.95, s.wave, 0.35));
  const end = (s.notes[s.notes.length - 1][1] + 1.5) * beat;
  s.chord.forEach(m => tone(m + 12, t0 + end - beat * 1.5, beat * 1.6, "triangle", 0.4));
}

// ---------- trivia (built from the verified season tables) ----------
function triviaQ() {
  const S = IPLDATA.seasons, pick = a => a[Math.floor(Math.random() * a.length)];
  const s = pick(S), kind = Math.floor(Math.random() * 6);
  const opts = (right, pool) => { const set = new Set([right]); let guard = 0; while (set.size < 4 && guard++ < 50) set.add(pick(pool)); return [...set].sort(() => Math.random() - .5); };
  if (kind === 0) return { q: `Who won the IPL in ${s.y}?`, a: TNAME[s.w], o: opts(TNAME[s.w], S.map(x => TNAME[x.w]).concat(["Delhi Capitals", "Punjab Kings", "Lucknow Super Giants"])) };
  if (kind === 1) return { q: `Who won the Orange Cap in ${s.y}?`, a: s.oc[0], o: opts(s.oc[0], S.map(x => x.oc[0])) };
  if (kind === 2) return { q: `Who won the Purple Cap in ${s.y}?`, a: s.pc[0], o: opts(s.pc[0], S.map(x => x.pc[0])) };
  if (kind === 3) return { q: `Who was Player of the Tournament in ${s.y}?`, a: s.mvp[0], o: opts(s.mvp[0], S.map(x => x.mvp[0])) };
  if (kind === 4) return { q: `Who captained the ${s.y} champions, ${TNAME[s.w]}?`, a: s.cap, o: opts(s.cap, S.map(x => x.cap).concat(S.map(x => x.rcap))) };
  return { q: `Who did ${TNAME[s.w]} beat in the ${s.y} final?`, a: TNAME[s.ru], o: opts(TNAME[s.ru], S.map(x => TNAME[x.ru]).concat(S.map(x => TNAME[x.w]))) };
}

let lastHTML = "";
function render() {
  if (A.dragging) { A.pendingRender = true; return; }
  const app = $("#app");
  const S0 = A.mode === "online" || A.mode === "practice" ? view() : null;
  if (S0 && S0.phase === "done") { const gid = (S0.code || "P") + ":" + S0.created; if (A.recorded !== gid) { A.recorded = gid; if (S0.league) { if (A.isHost) leagueCommit(S0); else lgLoad(S0.league.id).then(l => { if (l) { A.league = l; render(); } }); } else recordGame(S0); } }
  document.body.classList.toggle("tvmode", !!(A.tv && S0 && S0.phase === "auction" && A.mode !== "home"));
  let html = A.stOpen ? stView() : A.mode === "home" ? homeView() : A.mode === "season" ? seasonView() : A.mode === "league" ? leagueView() : gameView();
  html += howtoHTML();
  const dk = dockHTML(); html += dk; document.body.classList.toggle("hasdock", !!dk);
  const S1 = view();
  document.body.classList.toggle("livetab", !!(S1 && S1.phase === "auction" && !A.stOpen && !A.tv && (A.tab || "live") === "live" && (A.mode === "online" || A.mode === "practice")));
  document.body.classList.toggle("hosting", !!A.isHost);
  document.body.classList.toggle("ingame", !!(S1 && !A.stOpen && (A.mode === "online" || A.mode === "practice")));
  if (html !== lastHTML) {
    const wins = {}; document.querySelectorAll("[data-win]").forEach(w => wins[w.dataset.win] = w.scrollTop);
    const keep = document.activeElement && document.activeElement.id;
    const sel = keep && document.activeElement.selectionStart;
    const typed = {}; app.querySelectorAll("input[id]:not([type=checkbox]):not([type=radio])").forEach(el => { if (el.value !== el.defaultValue) typed[el.id] = el.value; });
    app.innerHTML = html; lastHTML = html;
    for (const id in typed) { const el = document.getElementById(id); if (el && el.tagName === "INPUT" && el.value === el.defaultValue) el.value = typed[id]; }
    document.querySelectorAll("[data-win]").forEach(w => { if (wins[w.dataset.win] != null) w.scrollTop = wins[w.dataset.win]; });
    if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  }
  tickUI();
}

// countdown + calls, run often without re-rendering
function tickUI() {
  const S = view(); if (!S) return;
  if (S.phase === "accel_pick") { const el = $("#picksecs"); if (el) el.textContent = Math.max(0, Math.ceil(((S.pickEnds || 0) - hostNow()) / 1000)) + "s"; return; }
  const L = S.lot; if (S.phase !== "auction" || !L) return;
  const secsEl = $("#secs"), ring = $("#ring"), call = $("#call"), ds = $("#dsecs"), dr = $("#dring");
  let left, span;
  if (L.stage === "sold" || L.stage === "unsold") { if (secsEl) { secsEl.textContent = "🔨"; ring.style.strokeDashoffset = 232.5; } if (ds) { ds.textContent = "🔨"; dr.style.strokeDashoffset = 100.5; } return; }
  if (S.paused) { left = S.pauseLeft; } else left = Math.max(0, L.ends - hostNow());
  span = (L.stage === "bidding" ? (L.by ? (S.round === "accel" ? E.T(S, "accelSecs") : E.T(S, "bidSecs")) : (S.round === "accel" ? E.T(S, "accelSecs") : (S.fast ? 0.5 : 1) * S.settings.openSecs + (S.settings.aiHost && !S.fast ? 4 : 0))) : E.T(S, "rtmSecs")) * 1000;
  const s = Math.ceil(left / 1000);
  if (ds) { ds.textContent = s; dr.style.strokeDashoffset = 100.5 * (1 - Math.min(1, left / span)); dr.style.stroke = left < 3000 ? "var(--bad)" : "var(--gold)"; ds.parentElement.classList.toggle("hot", left < 3000 && L.stage === "bidding"); }
  if (!secsEl) return;
  secsEl.textContent = s;
  ring.style.strokeDashoffset = 232.5 * (1 - Math.min(1, left / span));
  ring.style.stroke = left < 3000 ? "var(--bad)" : "var(--gold)";
  if (!S.paused && L.stage === "bidding" && L.by) {
    const c = left <= 1200 ? "Going twice…" : left <= 2800 ? "Going once…" : "";
    if (call.textContent !== c) call.textContent = c;
    const ck = L.seq + ":" + L.bids + ":" + c;
    if (c && A.callKey !== ck) { A.callKey = ck; blip(c === "Going twice…" ? 740 : 620); }
  }
}

// ---------------- Live tension: bidding war, momentum, scarcity, opportunity cost ----------------
const CAT_ONE = { W: "keeper", B: "batter", A: "all-rounder", SP: "spinner", PC: "pacer" };
const CAT_MANY = { W: "keepers", B: "batters", A: "all-rounders", SP: "spinners", PC: "pacers" };
function liveHeat(L) {
  const h = (L.hist || []).filter(x => x.t);
  let war = null;
  if (h.length >= 4) {
    const last = h.slice(-4), a = last[0].f, b = last[1].f;
    if (a !== b && last.every((x, i) => x.f === (i % 2 ? b : a))) {
      war = [last[3].f, last[2].f]; // leader first
      let n = 4; for (let i = h.length - 5; i >= 0 && (h[i].f === a || h[i].f === b) && h[i].f !== h[i + 1].f; i--) n++;
      war.push(n);
    }
  }
  const r3 = h.slice(-3), hot = r3.length === 3 && r3[2].t - r3[0].t <= 10000;
  return { war, hot };
}
function remainingIn(S, cat, exceptId) {
  const owned = new Set(); Object.values(S.teams).forEach(t => t.players.forEach(x => owned.add(x.id)));
  const ids = new Set();
  for (let i = S.idx + 1; i < (S.order || []).length; i++) ids.add(S.order[i]);
  (S.unsold || []).forEach(id => ids.add(id));
  let n = 0; ids.forEach(id => { if (id !== exceptId && !owned.has(id) && P[id] && pcat(P[id]) === cat) n++; });
  return n;
}
function scarcityHTML(S, L, p) {
  if (L.stage !== "bidding") return "";
  const cat = pcat(p), left = remainingIn(S, cat, p.id), amt = E.nextBid(L, P);
  let cant = 0, osFull = 0;
  for (const [f, t] of Object.entries(S.teams)) {
    if (f === L.by) continue;
    const why = E.canAfford(S, { ...t, players: padPlayers(t) }, amt, p.id, P);
    if (why === "Overseas slots full") osFull++; else if (why) cant++;
  }
  const bits = [`<b>${left}</b> more ${left === 1 ? CAT_ONE[cat] : CAT_MANY[cat]} after him`];
  if (cant) bits.push(`<b>${cant}</b> team${cant === 1 ? "" : "s"} can't go to ${fmt(amt)}`);
  if (p.o && osFull) bits.push(`<b>${osFull}</b> with ✈ slots full`);
  return `<div class="scarce ${left <= 3 ? "low" : ""}">${left <= 3 ? "⏳" : "📦"} ${bits.join(" · ")}</div>`;
}
function oppCost(S, amt, p) {
  const cat = pcat(p);
  const sold = (S.log || []).filter(x => x.k === "sold" && x.how !== "R" && P[x.pid] && pcat(P[x.pid]) === cat);
  let avg, what;
  if (sold.length >= 2) { avg = sold.reduce((s, x) => s + x.price, 0) / sold.length; what = `${CAT_MANY[cat]} at tonight's average price`; }
  else {
    const owned = new Set(); Object.values(S.teams).forEach(t => t.players.forEach(x => owned.add(x.id)));
    const rest = []; for (let i = S.idx + 1; i < (S.order || []).length; i++) { const q = P[S.order[i]]; if (q && !owned.has(q.id) && pcat(q) === cat) rest.push(E.base(q)); }
    if (!rest.length) return "";
    avg = rest.reduce((s, x) => s + x, 0) / rest.length; what = `${CAT_MANY[cat]} still to come at base price`;
  }
  if (!avg) return "";
  const n = amt / avg; if (n < 1.5) return "";
  const ns = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10;
  return `${fmt(amt)} could buy ~${ns} ${what}`;
}

// ---------------- Squad radar (counts and targets only, never ratings) ----------------
function radarData(S, fid, extra) {
  const t = S.teams[fid], need = getNeeds(fid), have = { W: 0, B: 0, A: 0, SP: 0, PC: 0 };
  const ids = t.players.map(x => x.id).concat(extra || []);
  ids.forEach(id => { if (P[id]) have[pcat(P[id])]++; });
  const os = ids.filter(id => P[id] && P[id].o).length, osCap = Math.min(S.settings.maxOs, 8) || 1;
  const r = (a, b) => b ? Math.min(1, a / b) : 1;
  return [
    ["Batting", r(have.B, need.B)], ["Bowling", r(have.SP + have.PC, (need.SP || 0) + (need.PC || 0))], ["All-round", r(have.A, need.A)],
    ["Keeping", r(have.W, need.W)], ["Overseas", r(os, osCap)], ["Purse left", Math.max(0, Math.min(1, t.purse / (S.settings.purse || 1)))],
  ];
}
function radarSVG(S, fid, extra, size = 210) {
  const d = radarData(S, fid), d2 = extra && extra.length ? radarData(S, fid, extra) : null;
  const c = size / 2, R = size / 2 - 34, n = d.length, col = F[fid].c1 === "#1C1C1C" ? "#E9B949" : F[fid].c1;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * R * v, c + Math.sin(a) * R * v]; };
  const poly = vals => vals.map((x, i) => pt(i, Math.max(0.04, x[1])).map(v => v.toFixed(1)).join(",")).join(" ");
  const rings = [0.25, 0.5, 0.75, 1].map(k => `<polygon points="${d.map((x, i) => pt(i, k).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes = d.map((x, i) => { const [X, Y] = pt(i, 1); return `<line x1="${c}" y1="${c}" x2="${X}" y2="${Y}" stroke="var(--line)"/>`; }).join("");
  const labels = d.map((x, i) => { const [X, Y] = pt(i, 1.2); return `<text x="${X}" y="${Y}" text-anchor="middle" dominant-baseline="middle">${x[0]}</text><text class="v" x="${X}" y="${Y + 12}" text-anchor="middle" dominant-baseline="middle">${Math.round(x[1] * 100)}%</text>`; }).join("");
  return `<figure class="radar"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Squad shape: ${d.map(x => x[0] + " " + Math.round(x[1] * 100) + "%").join(", ")}">
    ${rings}${spokes}${d2 ? `<polygon points="${poly(d2)}" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-dasharray="4 3" stroke-width="1.5"/>` : ""}
    <polygon points="${poly(d)}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/>${labels}</svg>
    <figcaption class="small muted">How full each part of your squad is against your targets${d2 ? ". Dashed: if you land your shortlist" : ""}. Purse = share of your purse left.</figcaption></figure>`;
}
